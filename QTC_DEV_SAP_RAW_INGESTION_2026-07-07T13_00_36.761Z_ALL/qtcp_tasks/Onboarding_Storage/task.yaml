properties:
  name: Onboarding_Storage
  id: onboarding_storage-lpah
  description: ''
  type: STORAGE
settings:
  ddlHandlingPolicy:
    addColumn: APPLY_TO_TARGET
    changeColumnType: IGNORE
    renameTable: SUSPEND_TABLE
    renameColumn: SUSPEND_TABLE
    dropTable: IGNORE
    dropColumn: IGNORE
    truncateTable: IGNORE
    createTable: APPLY_TO_TARGET
  artifactsSettings:
    liveViewsEnabled: true
    historyEnabled: true
    materialized: true
    changeTablesEnabled: true
    currentTableSuffix: __current
    reloadType: COMPARE_AND_APPLY_WITH_DELETED_ROWS
    artifactsPrefix: STG_
  fullLoadOnly: false
  artifactsLocation:
    internalSchema: '{{task.onboarding_storage-lpah.internalSchema}}'
    taskSchema: '{{task.onboarding_storage-lpah.taskSchema}}'
    databaseName: '{{task.onboarding_storage-lpah.databaseName}}'
  taskRuntime:
    tableUpdateConcurrency: 10
    warehouseSelection:
      warehouseName: '{{task.onboarding_storage-lpah.warehouseName}}'
  catalogIntegration:
    publishDatasets: false
  tableTypeSettings:
    tableType: REGULAR
    icebergSettings:
      snowflakeExternalVolume: ''
      folderLocationType: DATA_ASSET_NAME
      specificFolder: ''
      enableOpenCatalogSync: false
      snowflakeOpenCatalog: ''
  viewType: DEFAULT
